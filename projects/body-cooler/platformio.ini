; =============================================================================
;  body-cooler  --  ESP32-S3 全身降温器（背包式，冰袋 + 水泵循环）
;  16 MB QIO flash  |  8 MB OPI PSRAM
; =============================================================================

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- 模组特性：N16R8 需要下面几行全部覆盖 --------------------------------
board_build.mcu                     = esp32s3
board_build.flash_mode              = qio
board_build.arduino.memory_type     = qio_opi
board_upload.flash_size             = 16MB
board_build.partitions              = default_16MB.csv

board_build.f_cpu                   = 240000000L
board_build.f_flash                 = 80000000L

; --- 编译开关 ---------------------------------------------------------------
; BOARD_HAS_PSRAM 必须显式定义，否则 esp32-hal-psram.h 会把 CONFIG_SPIRAM
; #undef 掉，psramFound() 永远是 false。
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
; USB_CDC_ON_BOOT=1 -> 串口输出走【原生 USB 口】(板子上标 USB 的那个)
; USB_CDC_ON_BOOT=0 -> 串口输出走【UART 口】(板载 CH343 桥，标 UART 的那个)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

; --- 依赖库 -----------------------------------------------------------------
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.9.0

; --- 主机通信 ---------------------------------------------------------------
monitor_speed = 115200
upload_speed  = 921600
