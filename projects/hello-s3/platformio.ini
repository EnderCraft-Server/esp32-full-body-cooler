; =============================================================================
;  ESP32-S3-N16R8  --  PlatformIO project configuration
;  Module: ESP32-S3  |  16 MB QIO flash  |  8 MB OPI (octal) PSRAM
; =============================================================================

; `pio run` with no -e builds only the primary environment.  Without this,
; every env in the file is built on each invocation -- and since the debug env
; uses different build flags it gets its own build directory and recompiles the
; whole Arduino framework.
[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Module specifics -------------------------------------------------------
; The stock esp32-s3-devkitc-1 board definition assumes 8 MB QIO flash and no
; PSRAM.  An N16R8 module needs all four of the following overrides, otherwise
; the image is linked for the wrong flash size or the octal PSRAM is never
; initialised (psramFound() returns false).
board_build.mcu                     = esp32s3
board_build.flash_mode              = qio
board_build.arduino.memory_type     = qio_opi
board_upload.flash_size             = 16MB
board_build.partitions              = default_16MB.csv

; --- CPU / clocks -----------------------------------------------------------
board_build.f_cpu                   = 240000000L
board_build.f_flash                 = 80000000L

; --- USB + PSRAM ------------------------------------------------------------
; ARDUINO_USB_*: this board reaches the host through an on-board CH343 UART
;   bridge, NOT the ESP32-S3 native USB peripheral.  So the ROM bootloader
;   lives on UART0 and the Arduino CDC-on-boot USB stack stays disabled.
;
; BOARD_HAS_PSRAM: REQUIRED, and separate from memory_type above.  The
;   memory_type picks which precompiled SDK libs get linked, but the Arduino
;   core still compiles PSRAM out unless this macro is defined --
;   esp32-hal-psram.h explicitly does:
;       #ifndef BOARD_HAS_PSRAM
;       #undef CONFIG_SPIRAM
;       #endif
;   Omit it and the firmware boots happily while psramFound() stays false.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLED_PIN=48

; --- Host communication -----------------------------------------------------
monitor_speed = 115200
upload_speed  = 921600

[env:esp32-s3-n16r8-debug]
extends = env:esp32-s3-n16r8
build_type = debug
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_SMOKE_TEST=1
